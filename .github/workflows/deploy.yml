# Builds the site and publishes it to GitHub Pages (free): https://ethankaufman.github.io/ManUtd-Site/
# Runs on every push to main, and can be started by hand (Actions tab -> "Deploy site" -> Run workflow).
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      # The site is built from a local database file, so create and fill it first.
      - name: Prepare the database
        run: npm run db:migrate

      - name: Build the site
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /ManUtd-Site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
